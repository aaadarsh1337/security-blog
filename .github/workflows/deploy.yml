name: Notify portfolio blog

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: notify-portfolio-blog
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch portfolio rebuild
        env:
          DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::PORTFOLIO_DISPATCH_TOKEN is not set. Add a classic PAT (repo scope) as a repository secret named PORTFOLIO_DISPATCH_TOKEN in security-blog."
            exit 1
          fi
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/aaadarsh1337/aaadarsh1337.github.io/dispatches \
            -d '{"event_type":"blog-updated"}'
